<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign In / Sign Up</title>
</head>

<body>

    <div class="card">

        <div class="card-bg card-bg-1"></div>
        <div class="card-bg card-bg-2"></div>

        <img class="logo logo-1" src="logo.png" alt="Logo">
        <img class="logo logo-2" src="logo.png" alt="Logo">

        <!-- Sign In Form -->
        <div class="form signin active">
            <h2>Sign In</h2>
            <form>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">
                <button>SIGN IN</button>
            </form>
            <p>Don't have an account?
                <a onclick="toggleView()"><em>Sign up</em></a>
            </p>
        </div>

        <!-- Sign Up Form -->
        <div class="form signup">
            <h2>Register</h2>
            <form>
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">
                <button>SIGN UP</button>
            </form>
            <p>Already have an account?
                <a onclick="toggleView()"><em>Sign in</em></a>
            </p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
